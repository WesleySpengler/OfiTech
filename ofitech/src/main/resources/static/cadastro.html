<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OfiTech - Criar conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-pagina">

    <aside class="login-lateral">
        <div class="marca">
            <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
                <path d="M17 2l13 7.5v15L17 32 4 24.5v-15z" fill="none" stroke="#f5b700" stroke-width="2.5" stroke-linejoin="round"/>
                <circle cx="17" cy="17" r="5.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
            </svg>
            <div><h1>OfiTech</h1><p>Gestão para oficinas mecânicas</p></div>
        </div>
        <div>
            <h2>Cada carro com sua ordem de serviço em dia.</h2>
            <p>Clientes, veículos, peças e serviços em um só lugar.</p>
            <span class="placa" aria-hidden="true">OFI 2T25</span>
        </div>
        <span></span>
    </aside>

    <main class="login-principal">

        <div class="login-container cadastro-container">

            <div class="login-titulo">
                <h1>Criar conta</h1>
                <p>Cadastre sua oficina para começar.</p>
            </div>

            <form id="formCadastro">

                <div>
                    <label for="nome">Seu nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="cadastro-divisao">Dados da oficina</div>

                <div>
                    <label for="nomeOficina">Nome da oficina</label>
                    <input type="text" id="nomeOficina" placeholder="Nome da sua oficina" required>
                </div>

                <div>
                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="Opcional">
                </div>

                <div>
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="Opcional">
                </div>

                <button type="submit">Criar conta</button>

            </form>

            <div class="login-cadastro">
                <span>Já possui uma conta?</span>
                <a href="/login.html">Entrar</a>
            </div>

            <div class="login-rodape">OfiTech - Gestão para oficinas mecânicas</div>

        </div>

    </main>

</div>

    <script>

        document.getElementById("formCadastro").addEventListener("submit", async function(event) {

            event.preventDefault();

            const cadastro = {

                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
                nomeOficina: document.getElementById("nomeOficina").value,
                cnpj: document.getElementById("cnpj").value,
                telefone: document.getElementById("telefone").value

            };

            try {

                const resposta = await fetch("/cadastro", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(cadastro)

                });

                if (resposta.ok) {

                    alert("Conta criada com sucesso!");

                } else {

                    alert("Não foi possível criar a conta.");

                }

            } catch (erro) {

                console.error(erro);

                alert("Erro ao conectar com o OfiTech.");

            }

        });

    </script>

</body>

</html>
