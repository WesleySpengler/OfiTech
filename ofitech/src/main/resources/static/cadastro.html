<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OfiTech - Criar conta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container cadastro-container">

        <div class="login-logo">

            <div class="login-logo-icon">
                O
            </div>

            <h1>OfiTech</h1>

            <p>Gestão inteligente para sua oficina</p>

        </div>

        <div class="login-titulo">

            <h2>Criar conta</h2>

            <p>
                Cadastre sua oficina para começar
            </p>

        </div>

        <form id="formCadastro">

            <label for="nome">
                Seu nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="seuemail@exemplo.com"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                required
            >

            <div class="cadastro-divisao">
                Dados da oficina
            </div>

            <label for="nomeOficina">
                Nome da oficina
            </label>

            <input
                type="text"
                id="nomeOficina"
                placeholder="Nome da sua oficina"
                required
            >

            <label for="cnpj">
                CNPJ
            </label>

            <input
                type="text"
                id="cnpj"
                placeholder="CNPJ (opcional)"
            >

            <label for="telefone">
                Telefone
            </label>

            <input
                type="text"
                id="telefone"
                placeholder="Telefone (opcional)"
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <div class="login-cadastro">

            <span>Já possui uma conta?</span>

            <a href="/login.html">
                Entrar
            </a>

        </div>

        <div class="login-rodape">
            OfiTech • Gestão para oficinas mecânicas
        </div>

    </div>

    <script>

        document.getElementById("formCadastro").addEventListener("submit", async function(event) {

            event.preventDefault();

            const cadastro = {

                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
                nomeOficina: document.getElementById("nomeOficina").value,
                cnpj: document.getElementById("cnpj").value,
                telefone: document.getElementById("telefone").value

            };

            try {

                const resposta = await fetch("/cadastro", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(cadastro)

                });

                if (resposta.ok) {

                    alert("Conta criada com sucesso!");

                } else {

                    alert("Não foi possível criar a conta.");

                }

            } catch (erro) {

                console.error(erro);

                alert("Erro ao conectar com o OfiTech.");

            }

        });

    </script>

</body>

</html>
